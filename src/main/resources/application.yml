spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:postgresql://localhost:5432/audioworkflow
    username: app
    password: secret

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000

  data:
    redis:
      host: localhost
      port: 6379

minio:
    url: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: audio-files
groq:
    api-key: your_key
    base-url: https://api.groq.com/openai/v1
    model: whisper-large-v3-turbo
