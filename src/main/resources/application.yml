spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/audioworkflow}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:secret}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

minio:
    url: ${MINIO_URL:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:audio-files}

groq:
    api-key: ${GROQ_API_KEY}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    model: ${GROQ_MODEL:whisper-large-v3-turbo}
    chat-model: ${GROQ_CHAT_MODEL:llama-3.1-8b-instant}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
